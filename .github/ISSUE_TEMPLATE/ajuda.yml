name: Pedir ajuda
description: "Uma dúvida sobre como usar o app."
title: "[Ajuda] "
labels: ["question"]
body:
  - type: textarea
    id: duvida
    attributes:
      label: "Sua dúvida"
    validations:
      required: true
  - type: textarea
    id: tentou
    attributes:
      label: "O que você já tentou"
  - type: input
    id: versao
    attributes:
      label: "Versão do app (opcional)"
      placeholder: "v0.5.0"
